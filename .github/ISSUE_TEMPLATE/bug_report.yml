name: Bug report
description: Report an issue with a DataPrep Desk tool.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not share sensitive dataset contents, credentials or personal records in a public GitHub issue."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / operating system
